[project]
name = "outlet-audit"
version = "0.1.0"
description = "Flag suspicious outlet-verification photos via self-supervised ViT consensus"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40,<5",
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6",
    "pillow>=10",
    "tqdm>=4.66",
    "easyocr>=1.7.1",
    "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
outlet-audit = "outlet_audit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
